<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co">
<title>PRONTO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- tema (tek katman: açık varsayılan, koyu isteğe bağlı) ---------- */
:root{--accent:#E6B22A;--btn:#E6B22A;--menu-w:248px;--menu-font:15px;--logo-size:40px;--brand-size:13px;--brand-weight:600;--brand-color:#6B6B70;
--r-lg:16px;--r:12px;--r-sm:8px;--font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
--ok:#3fb67a;--warn:#e0a53a;--info:#4f8fe6;--vio:#9a7bea;--err:#C0392B;
--ease:cubic-bezier(.22,.61,.36,1);--ease-out:cubic-bezier(.16,1,.3,1);
--bg:#F2F1EE;--bg2:#FFFFFF;--surface:rgba(255,255,255,.95);--surface-2:#FFFFFF;--border:rgba(28,28,30,.10);--border-2:rgba(28,28,30,.16);
--text:#1C1C1E;--muted:#6B6B70;--glass:rgba(255,255,255,.62);--shadow:0 12px 40px rgba(24,24,20,.16),0 2px 8px rgba(24,24,20,.06);
--hover:rgba(28,28,30,.022);--input:#FFFFFF;--zebra:rgba(28,28,30,.022);--mdl:rgba(255,255,255,.86);color-scheme:light}
[data-theme=dark]{--bg:#111214;--bg2:#202226;--surface:rgba(32,34,38,.86);--surface-2:rgba(255,255,255,.07);--border:rgba(255,255,255,.10);--border-2:rgba(255,255,255,.16);
--text:#ECEDEB;--muted:#9A9C9F;--glass:rgba(38,40,45,.58);--shadow:0 14px 44px rgba(0,0,0,.55);--hover:rgba(255,255,255,.055);--input:rgba(255,255,255,.045);
--zebra:rgba(255,255,255,.032);--err:#E57368;--brand-color:#9A9C9F;--mdl:rgba(32,34,38,.86);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden}
/* Sabit arka plan (sonsuz animasyon yok → boşta işlemci/GPU harcamaz) */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(42% 38% at 18% 14%,rgba(230,178,42,.13) 0%,transparent 62%),radial-gradient(46% 42% at 84% 78%,rgba(120,140,170,.11) 0%,transparent 64%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:22px}h2{font-size:17px}h3{font-size:15px}
.muted{color:var(--muted)}
.sm{font-size:12.5px}.b{font-weight:700}.r{text-align:right}.nowrap{white-space:nowrap}
.hidden{display:none!important}
svg.i{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- doğrulama: yalnızca kırmızı etiket + nokta, çerçeve yok ---------- */
.validation-error>label,.validation-error .field>label,.offer-person-row.validation-error .offer-person-label,.it.validation-error .it-title,
.field:has(.inp.bad)>label{color:#e5484d!important}
.validation-error>label::after,.validation-error .field>label::after,.offer-person-row.validation-error .offer-person-label::after,
.field:has(.inp.bad)>label::after{content:"";display:inline-block;width:6px;height:6px;margin-left:7px;vertical-align:middle;border-radius:50%;background:#e5484d}
.inp.bad{border-color:var(--border-2)!important;box-shadow:none!important}

/* ---------- kabuk ---------- */
.app{position:relative;display:flex;height:100%;overflow:hidden}
.side{width:var(--menu-w);flex-shrink:0;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-right:1px solid var(--border);z-index:40;overflow:hidden}
.side-top{padding:14px 14px 10px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;user-select:none;-webkit-user-select:none;touch-action:none;position:relative;background:#0A0A0A;border-radius:12px;padding:10px;margin:0 2px;-webkit-touch-callout:none;box-shadow:0 6px 28px rgba(24,24,20,.09)}
.brand img{width:auto;max-width:100%;height:var(--logo-size);object-fit:contain;pointer-events:none}
.brand .mark{height:var(--logo-size);width:var(--logo-size)}
.mark{aspect-ratio:1;display:grid;place-items:center;border-radius:11px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 95%,#fff),color-mix(in srgb,var(--accent) 70%,#000));color:#1b1407;font-weight:800;font-size:calc(var(--logo-size)*.5)}
.brand-text{display:block;font-size:var(--brand-size);font-weight:var(--brand-weight);color:var(--brand-color);letter-spacing:.14em;line-height:1.1}
.nav{flex:1;padding:8px 10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;overflow-x:hidden}
.nav-item{position:relative;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-size:var(--menu-font);font-weight:600;text-align:left;white-space:nowrap;transition:background-color .18s var(--ease),color .18s var(--ease),padding-left .18s var(--ease)}
.nav-item::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);height:0;width:2px;border-radius:2px;background:var(--accent);opacity:0;transition:height .2s var(--ease-out),opacity .18s var(--ease)}
.nav-item:hover{background:var(--hover);color:var(--text);padding-left:16px}
.nav-item:hover::before,.nav-item.active::before{opacity:1;height:58%}
.nav-item.active{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--text)}
.nav-item svg.i{width:20px;height:20px}
.nav-item.active svg,.nav-item:hover svg{color:var(--accent)}
.side-bot{padding:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:3px}
.sync{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:12px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
.sync.on i{background:var(--ok)}.sync.off i{background:var(--err)}.sync.wait i{background:var(--warn)}
.tgl{margin-left:auto;width:34px;height:20px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border-2);position:relative;flex-shrink:0}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.tgl.on::after{transform:translateX(14px);background:var(--accent)}
@media (max-width:560px){.side{width:56px}.side .lbl,.side .brand-text,.sync span{display:none}}
/* Masaüstü: menü açılır-kapanır ikon şeridi; logo her zaman aynı yerde ve aynı boyutta */
.side-tgl{display:none}
@media (min-width:561px){
 .side{position:relative;overflow:visible;transition:width .2s var(--ease)}
 .side-tgl{display:grid;place-items:center;position:absolute;right:-14px;top:calc(var(--logo-h,116px) - 2px);z-index:3;width:28px;height:28px;border-radius:50%;background:var(--surface);border:1px solid var(--border-2);box-shadow:0 2px 8px rgba(0,0,0,.14);color:var(--muted);font-size:17px;font-weight:800;line-height:1;cursor:pointer;padding:0 0 2px}
 .side-tgl:hover{color:var(--accent);border-color:var(--accent)}
 .app.rail .side{width:68px;overflow:visible}
 .app.rail .side-top{position:absolute;left:0;top:0;width:calc(var(--menu-w) - 1px);z-index:2;box-sizing:border-box}
 .app.rail .nav{padding-top:calc(var(--logo-h,116px) + 14px)}
 .app.rail .side .lbl,.app.rail .sync span,.app.rail .side .tgl{display:none}
 .app.rail .nav-item,.app.rail .nav-item:hover{justify-content:center;padding:12px 0}
 .app.rail .sync{justify-content:center;padding:6px 0}
}
/* Telefon: sol çubuk yerine alt menü çubuğu (içerik tam genişlik kullanır) */
@media (max-width:560px){
 .app{flex-direction:column}
 .main{order:1;flex:1;min-height:0}
 .side{order:2;width:100%;flex-direction:row;align-items:center;border-right:0;border-top:1px solid var(--border);padding:0 4px env(safe-area-inset-bottom,0px);min-height:58px}
 .side-top{padding:6px 2px 6px 4px;flex-direction:row;gap:0}
 .brand{width:44px;height:44px;padding:5px;margin:0;border-radius:11px;box-shadow:none}
 .brand img,.brand .mark{height:30px;max-width:34px;font-size:15px}
 .nav{flex-direction:row;padding:4px 0;gap:0;overflow:visible}
 .side .nav-item{flex:1;justify-content:center;padding:12px 0;gap:0;border-radius:10px;min-width:0}
 .side .nav-item:hover{padding-left:0}
 .side .nav-item::before{left:50%;top:auto;bottom:2px;transform:translateX(-50%);height:2px;width:0}
 .side .nav-item:hover::before,.side .nav-item.active::before{height:2px;width:40%}
 .nav-item svg.i{width:22px;height:22px}
 .side-bot{flex-direction:row;align-items:center;border-top:0;padding:4px 0;gap:0}
 .side-bot .nav-item{flex:0 0 40px}
 .side .tgl{display:none}
 .sync{padding:0 4px;position:absolute;left:44px;top:8px}
}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.page{flex:1;overflow:auto;padding:24px 28px 40px;animation:viewEnter .34s var(--ease-out) both}
.page.fill{display:flex;flex-direction:column;overflow:hidden;padding-bottom:16px}
@keyframes viewEnter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:767px){.page{padding:16px 14px 32px}.page.fill{padding-bottom:10px}}
.ph{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.ph-l{display:flex;align-items:center;gap:12px;min-width:0}
.ph-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- kontroller ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);font-weight:600;white-space:nowrap;transition:background-color .18s var(--ease),border-color .18s var(--ease),transform .12s var(--ease),box-shadow .18s var(--ease)}
.btn:hover{background:var(--surface-2);transform:translateY(-1px);box-shadow:0 3px 12px rgba(24,24,20,.08)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.primary{background:var(--accent);border-color:transparent;color:#1C1C1E;box-shadow:0 2px 10px rgba(230,178,42,.34)}
.btn.primary:hover{background:#C08F14;color:#fff;box-shadow:0 5px 18px rgba(230,178,42,.42)}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent)}
.btn.danger.solid{background:var(--err);color:#fff;border-color:transparent}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--hover)}
.btn.icon{width:38px;padding:0}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.icon.sm{width:30px;padding:0}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:12.5px;color:var(--muted);font-weight:600}
.field>label .req{color:var(--accent)}
.inp,select.inp,textarea.inp{width:100%;height:38px;padding:0 11px;border-radius:var(--r-sm);border:1px solid var(--border-2);background:var(--input);outline:none;transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
textarea.inp{height:auto;min-height:62px;padding:9px 11px;resize:vertical;line-height:1.45}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(230,178,42,.18)}
.inp:disabled{opacity:.5}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 16px,calc(100% - 11px) 16px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
select.inp option{background:var(--bg2);color:var(--text)}
.pickbtn{justify-content:space-between;width:100%;font-weight:500;background:var(--input)}
.err-t{color:var(--err);font-size:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}}
.search{position:relative;flex:1;min-width:180px;max-width:420px}
.search svg{position:absolute;left:11px;top:10px;color:var(--muted)}
.search .inp{padding-left:36px}
.radio-row{display:flex;gap:16px;flex-wrap:wrap}
.radio{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13.5px}
.radio input{appearance:none;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--border-2);margin:0;display:grid;place-items:center}
.radio input:checked{border-color:var(--accent)}
.radio input:checked::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--border-2);border-radius:var(--r-sm);overflow:hidden;flex-shrink:0}
.seg button{border:0;background:transparent;padding:0 12px;height:36px;font-weight:600;color:var(--muted)}
.seg button.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}

/* ---------- yüzeyler ---------- */
.card,.stat,.offer-kpi,.lcard,.tw{background:var(--surface);border:1px solid var(--border);box-shadow:0 6px 28px rgba(24,24,20,.09)}
.card{border-radius:var(--r-lg);padding:16px}
.card+.card{margin-top:14px}
.dgrid>.card,.stats>.card{margin-top:0}
.page.detail{display:flex;flex-direction:column;padding-bottom:0}
.page.detail>*{flex-shrink:0}
.page.detail .tw{flex:none}
.page.detail .totbar{margin-top:auto;margin-bottom:0!important}
.page.detail>.tw,.page.detail>.empty{margin-bottom:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tags:empty{display:none}
.ftag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:20px;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent);font-size:12px;font-weight:600}
.st{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;border:1px solid}
/* Siparişe gönderilmemiş "Beklemede" teklif: renkli, hareketli uyarı */
.st.st-gonder{gap:6px;color:#fff;border-color:transparent;background:linear-gradient(90deg,#f59e0b,#ef4444,#ec4899,#f59e0b);background-size:300% 100%;animation:gonderAk 3.2s linear infinite,gonderNabiz 1.8s ease-out infinite;text-shadow:0 1px 1px rgba(0,0,0,.18)}
.st.st-gonder .st-dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:gonderNokta 1.1s ease-in-out infinite alternate}
@keyframes gonderAk{to{background-position:300% 0}}
@keyframes gonderNabiz{0%{box-shadow:0 0 0 0 rgba(239,68,68,.55)}70%{box-shadow:0 0 0 7px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
@keyframes gonderNokta{from{opacity:.35;transform:scale(.7)}to{opacity:1;transform:scale(1.1)}}
tr.gonder-yok>td:first-child{box-shadow:inset 3px 0 0 #ef4444}
.lcard.gonder-yok{box-shadow:inset 3px 0 0 #ef4444}
.btn.btn-gonder{color:#fff;border-color:transparent;background:linear-gradient(90deg,#f59e0b,#ef4444,#ec4899,#f59e0b);background-size:300% 100%;animation:gonderAk 3.2s linear infinite,gonderNabiz 1.8s ease-out infinite;font-weight:800}
.k-uyari{display:inline-flex;align-items:center;gap:6px;color:#ef4444;font-weight:700}
.k-uyari .st-dot{width:7px;height:7px;border-radius:50%;background:#ef4444;animation:gonderNokta 1.1s ease-in-out infinite alternate}
.st-Beklemede{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.st-Üretimde{color:var(--info);border-color:color-mix(in srgb,var(--info) 40%,transparent);background:color-mix(in srgb,var(--info) 10%,transparent)}
.st-Sevkiyata{color:var(--vio);border-color:color-mix(in srgb,var(--vio) 40%,transparent);background:color-mix(in srgb,var(--vio) 10%,transparent)}
.st-Teslim{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.st-Onay{color:var(--warn);border-color:var(--warn);border-style:dashed;background:transparent}.st-Reddedildi{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent);background:color-mix(in srgb,var(--err) 10%,transparent)}.sipbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);margin:0 0 14px}.sipbox b{font-weight:700}.sipbox .grow{flex:1;min-width:200px}.sipbox.ok{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}.sipbox.wait{border-color:color-mix(in srgb,var(--warn) 55%,transparent)}.sipbox.err{border-color:color-mix(in srgb,var(--err) 50%,transparent)}.sipbox .note{font-size:12.5px;color:var(--err)}.siptag{display:inline-flex;gap:6px;align-items:center;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}.st-İptal{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent);background:color-mix(in srgb,var(--err) 10%,transparent)}

/* ---------- tablolar ---------- */
.tw{flex:1;min-height:0;overflow:auto;border-radius:var(--r-lg)}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{position:sticky;top:0;z-index:2;background:var(--bg2);text-align:left;font-weight:700;color:var(--muted);font-size:12px;border-bottom:1px solid var(--border);padding:0;white-space:nowrap}
.tbl th .thi{overflow:hidden;padding:10px 12px}
.tbl th.r .thi{text-align:right}
/* Teklifler tablosu: iki satırlı hücreler — ilgili bilgiler alt alta; hiçbir sütun gizlenmez, tutarlar kesilmez */
.tbl.offers{table-layout:auto;width:100%;font-variant-numeric:tabular-nums}
.tbl.offers th .thi{line-height:1.25;padding:9px 10px}
.tbl.offers td{padding:8px 10px;max-width:none;overflow:visible;text-overflow:clip}
.tbl.offers .alt{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:500}
.tbl.offers td.mus{white-space:normal;min-width:140px;max-width:260px;font-weight:600;line-height:1.3}
.tbl.offers td:last-child{width:44px;padding:4px 6px}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.tbl tbody tr{cursor:pointer;transition:background-color .14s var(--ease)}
.tbl tbody tr:hover{background:var(--hover)}
.tbl tbody tr.sel{background:color-mix(in srgb,var(--accent) 7%,transparent);box-shadow:inset 2px 0 0 var(--accent)}
.tbl.static tbody tr{cursor:default}
.tbl td.wrap{white-space:normal}
.cards{display:none;gap:10px;padding:10px}
.lcard{border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.lcard .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lcard .ttl{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:767px){.tw .tbl.resp{display:none}.tw .cards{display:grid;grid-template-columns:minmax(0,1fr);padding:0}.tw{background:transparent;border:0;box-shadow:none}}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.more-l{padding:12px;text-align:center;color:var(--muted);font-size:12px}

'use strict';
/* =====================================================================
   PRONTO — Teklif / Satış Sistemi
   Veri: Supabase (tek tablo pt_rows) + cihazda IndexedDB önbellek.
   Trafik kuralı: açılışta yalnızca "son eşitlemeden beri değişen" satırlar

/* ---------- güvenli şablon (tüm kullanıcı verisi otomatik escape edilir) ---------- */
const RAW = Symbol('raw');

const pad = (n, l = 5) => String(n).padStart(l, '0');

const fmtDate = iso => { if (!iso) return '—'; const [y, m, d] = String(iso).slice(0, 10).split('-'); return `${d}.${m}.${y}`; };
const fmtDT = ts => { const d = new Date(ts); return `${pad(d.getDate(),2)}.${pad(d.getMonth()+1,2)}.${d.getFullYear()} — ${pad(d.getHours(),2)}:${pad(d.getMinutes(),2)}`; };
const SYM = { TRY: '₺', USD: '$', EUR: '€' };
const CURS = ['TRY', 'USD', 'EUR'];
const NF = new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (n, c = 'TRY') => `${NF.format(+n || 0)} ${SYM[c] || ''}`;
const r2 = n => Math.round((+n || 0) * 100) / 100;
const num = v => { if (typeof v === 'number') return v; const s = String(v ?? '').trim().replace(/\s/g, ''); if (!s) return 0; const n = s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s; const x = Number(n); return Number.isFinite(x) ? x : NaN; };

const deep = o => JSON.parse(JSON.stringify(o));
const isMobile = () => matchMedia('(max-width:767px)').matches;
const V = {
  phone: s => !s || (/^\+?[\d\s()-]+$/.test(s) && (s.replace(/\D/g, '').length >= 10 && s.replace(/\D/g, '').length <= 15)),
  email: s => !s || /^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]{2,}$/.test(s),
  tckn(s) { if (!/^[1-9]\d{10}$/.test(s)) return false; const d = [...s].map(Number); const o = d[0]+d[2]+d[4]+d[6]+d[8], e = d[1]+d[3]+d[5]+d[7]; if (((o*7 - e) % 10 + 10) % 10 !== d[9]) return false; return d.slice(0,10).reduce((a,b)=>a+b,0) % 10 === d[10]; },
  vkn: s => /^\d{10}$/.test(s)
};

/* ---------- ikonlar ---------- */
const IP = {
  doc:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',

  print:'<path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/>',
  pdf:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14l3 3 3-3"/>',
  share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  grip:'<circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/>',
  back:'<path d="M15 18l-6-6 6-6"/>',
  up:'<path d="M18 15l-6-6-6 6"/>', down:'<path d="M6 9l6 6 6-6"/>',
  zin:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/>',
  zout:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6"/>',
  img:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/>',
  xls:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 12l5 6M14 12l-5 6"/>'
};
const I = (n, cls = '') => raw(`<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${IP[n] || ''}</svg>`);

/* ---------- sabit listeler ---------- */
const ILLER = ['Adana','Adıyaman','Afyonkarahisar','Ağrı','Aksaray','Amasya','Ankara','Antalya','Ardahan','Artvin','Aydın','Balıkesir','Bartın','Batman','Bayburt','Bilecik','Bingöl','Bitlis','Bolu','Burdur','Bursa','Çanakkale','Çankırı','Çorum','Denizli','Diyarbakır','Düzce','Edirne','Elazığ','Erzincan','Erzurum','Eskişehir','Gaziantep','Giresun','Gümüşhane','Hakkâri','Hatay','Iğdır','Isparta','İstanbul','İzmir','Kahramanmaraş','Karabük','Karaman','Kars','Kastamonu','Kayseri','Kırıkkale','Kırklareli','Kırşehir','Kilis','Kocaeli','Konya','Kütahya','Malatya','Manisa','Mardin','Mersin','Muğla','Muş','Nevşehir','Niğde','Ordu','Osmaniye','Rize','Sakarya','Samsun','Siirt','Sinop','Sivas','Şanlıurfa','Şırnak','Tekirdağ','Tokat','Trabzon','Tunceli','Uşak','Van','Yalova','Yozgat','Zonguldak'];
const ULKELER = ['Türkiye','ABD','Afganistan','Almanya','Arnavutluk','Arjantin','Avustralya','Avusturya','Azerbaycan','Bahreyn','Belçika','Beyaz Rusya','Birleşik Arap Emirlikleri','Birleşik Krallık','Bosna-Hersek','Brezilya','Bulgaristan','Cezayir','Çekya','Çin','Danimarka','Endonezya','Ermenistan','Estonya','Etiyopya','Fas','Filipinler','Filistin','Finlandiya','Fransa','Gana','Güney Afrika','Güney Kore','Gürcistan','Hindistan','Hırvatistan','Hollanda','Irak','İran','İrlanda','İspanya','İsrail','İsveç','İsviçre','İtalya','İzlanda','Japonya','Kamerun','Kanada','Karadağ','Katar','Kazakistan','Kenya','Kıbrıs','KKTC','Kırgızistan','Kolombiya','Kosova','Kuveyt','Kuzey Makedonya','Letonya','Libya','Litvanya','Lübnan','Lüksemburg','Macaristan','Malezya','Malta','Meksika','Mısır','Moldova','Moğolistan','Nijerya','Norveç','Özbekistan','Pakistan','Polonya','Portekiz','Romanya','Rusya','Senegal','Sırbistan','Singapur','Slovakya','Slovenya','Somali','Sudan','Suriye','Suudi Arabistan','Şili','Tacikistan','Tanzanya','Tayland','Tunus','Türkmenistan','Ukrayna','Umman','Ürdün','Venezuela','Vietnam','Yemen','Yeni Zelanda','Yunanistan'];
const DURUMLAR = ['Onay Bekliyor','Reddedildi','Beklemede','Üretimde','Sevkiyata Hazır','Teslim Edildi','İptal'];
const stTag = d => html`<span class="st st-${String(d).split(' ')[0]}">${d}</span>`;
/* ---------- Sipariş Takibi bağlantısı ----------
   "siparis" satırlarını yalnızca veritabanı yazar; bu program sadece okur ve gösterir. */
const SIP_SIRA = ['Beklemede', 'Üretimde', 'Sevkiyata Hazır', 'Teslim Edildi'];
const sipBag = t => (t && mem('siparis').get(t.id)) || null;
function tkDurum(t) {
  const b = sipBag(t); if (!b) return t.durum || 'Beklemede';
  if (b.bag === 'bekliyor') return 'Onay Bekliyor';
  if (b.bag === 'reddedildi') return 'Reddedildi';
  const ds = (t.items || []).map(i => b.kalemler?.[i.uid]?.durum).filter(Boolean);
  if (!ds.length) return 'Beklemede';
  const aktif = ds.filter(d => d !== 'İptal'); if (!aktif.length) return 'İptal';
  return aktif.reduce((m, d) => (SIP_SIRA.indexOf(d) < SIP_SIRA.indexOf(m) ? d : m), 'Teslim Edildi');
}
const sipNo = id => 'PR-' + String(id).padStart(5, '0');
/* Siparişe hiç gönderilmemiş, beklemedeki teklif (unutulmasın diye renkli ve hareketli gösterilir) */
const gonderilmedi = t => !!t && !t.deletedAt && !sipBag(t) && (t.durum || 'Beklemede') === 'Beklemede';
const durumTag = t => gonderilmedi(t) ? html`<span class="st st-gonder" title="Siparişe gönderilmedi"><i class="st-dot"></i>Beklemede</span>` : stTag(tkDurum(t));
function sipKalemTag(t, it) {
  const k = sipBag(t)?.kalemler?.[it.uid]; if (!k) return '';
  return html`<div class="siptag">${sipNo(k.no)} ${stTag(k.durum)}</div>`;
}
function sipFotoKeys(t) {
  const o = {};
  for (const it of t.items || []) {
    let k = '';
    if (it.fotoRef && photoGet(it.fotoRef)) k = it.fotoRef;
    else { const k3 = trLower(it.kategori) + '|' + trLower(it.model) + '|' + trLower(it.modul || ''), k2 = trLower(it.kategori) + '|' + trLower(it.model); k = photoGet(k3) ? k3 : photoGet(k2) ? k2 : ''; }
    if (k) o[it.uid] = k;
  }
  return o;
}
async function sipGonder(t, { sessiz = false } = {}) {
  if (!navigator.onLine) { toast('İnternet bağlantısı yok. Bağlantı gelince tekrar deneyin.', 'err'); return null; }
  await Sync.flush();
  if ([...Sync.outbox.values()].some(o => (o.tbl === 'teklifler' && o.id === t.id) || o.tbl === 'photo')) { toast('Teklif henüz sunucuya kaydedilmedi, birkaç saniye sonra tekrar deneyin.', 'err'); return null; }
  try {
    const r = await api('rpc/pronto_teklif_gonder', { method: 'POST', body: { p_teklif_id: t.id, p_foto: sipFotoKeys(t) } });
    const m = { gonderildi: `Teklif ${t.no} Sipariş Takibi'ne onaya gönderildi`, guncelleme_gonderildi: 'Değişiklikler Sipariş Takibi\'ne onaya gönderildi', degisiklik_yok: sessiz ? '' : 'Siparişi etkileyen bir değişiklik yok' }[r?.sonuc];
    if (m) toast(m, 'ok', 5000);
    return r;
  } catch (e) { toast('Sipariş Takibi\'ne gönderilemedi: ' + (e.message || e), 'err'); return null; }
}
function sipPanel(t) {
  const b = sipBag(t); if (!b) return '';
  if (b.bag === 'bekliyor') return html`<div class="sipbox wait"><div class="grow"><b>Sipariş Takibi'nde onay bekliyor</b><div class="muted sm">Onaylanınca ürünlerin durumu burada görünecek.</div></div></div>`;
  if (b.bag === 'reddedildi') return html`<div class="sipbox err"><div class="grow"><b>Sipariş Takibi reddetti</b><div class="note">${b.ret_notu || ''}</div><div class="muted sm">Düzeltip tekrar gönderebilirsiniz.</div></div><button class="btn primary sm" data-act="sipGonder" data-id="${t.id}">Tekrar Gönder</button></div>`;
  return html`<div class="sipbox ok"><div class="grow"><b>Siparişe dönüştü</b> · durumlar Sipariş Takibi'nden yönetilir
    ${b.bekleyen === 'guncelleme' ? html`<div class="muted sm" style="color:var(--warn)">Yaptığınız değişiklikler Sipariş Takibi'nde onay bekliyor.</div>` : ''}
    ${b.ret_notu ? html`<div class="note">${b.ret_notu}</div>` : ''}</div></div>`;
}


/* =====================================================================
   BULUT BAĞLANTISI (Supabase REST + Auth + Realtime Broadcast)
   Kütüphane yok: yalnızca kullanılan uç noktalar, fetch + WebSocket.
   ===================================================================== */
const Local = {

  del(k) { try { localStorage.removeItem('pl_' + k); } catch {} }
};
const CFG = (() => {

  return { url: String(w.url || l.url || '').trim().replace(/\/+$/, ''), key: String(w.anonKey || l.key || '').trim(), email: String(w.email || l.email || 'ekip@pronto.app').trim() };

class NetError extends Error {}
class AuthError extends Error {}

const Auth = {
  s: Local.get('session', null),
  save(s) { this.s = s; s ? Local.set('session', s) : Local.del('session'); },
  async call(path, body, token, method = 'POST') {
    let r;
    try { r = await fetch(`${CFG.url}/auth/v1/${path}`, { method, headers: { apikey: CFG.key, 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) }, body: body ? JSON.stringify(body) : undefined }); }
    catch { throw new NetError('Sunucuya ulaşılamadı. İnternet bağlantısını kontrol edin.'); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new AuthError(j.error_description || j.msg || j.message || 'İşlem başarısız');
    return j;
  },
  keep(j) { this.save({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000 }); RT.setToken(j.access_token); },
  async login(pw) { this.keep(await this.call('token?grant_type=password', { email: CFG.email, password: pw })); },
  _ref: null,
  async refresh() {
    this._ref ||= this.call('token?grant_type=refresh_token', { refresh_token: this.s?.refresh_token })
      .then(j => this.keep(j))
      .catch(e => { if (e instanceof AuthError) sessionEnded(); throw e; })
      .finally(() => { this._ref = null; });
    return this._ref;
  },
  async token() {
    if (!this.s) { sessionEnded(); throw new AuthError('Oturum yok'); }
    if (Date.now() > this.s.expires_at - 60e3) await this.refresh();
    return this.s.access_token;
  },
  async changePassword(pw) { await this.call('user', { password: pw }, await this.token(), 'PUT'); },
  async logoutOthers() { await this.call('logout?scope=others', null, await this.token()); },
  async logout() { try { if (this.s) await this.call('logout?scope=local', null, this.s.access_token); } catch {} this.save(null); }
};

async function api(path, { method = 'GET', body, prefer } = {}) {
  const t = await Auth.token();
  let r;
  try { r = await fetch(`${CFG.url}/rest/v1/${path}`, { method, headers: { apikey: CFG.key, Authorization: 'Bearer ' + t, 'Content-Type': 'application/json', ...(prefer ? { Prefer: prefer } : {}) }, body: body ? JSON.stringify(body) : undefined }); }
  catch { throw new NetError('Çevrimdışı'); }
  if (r.status === 401) { await Auth.refresh(); return api(path, { method, body, prefer }); }
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw Object.assign(new Error(j.message || `Sunucu hatası (${r.status})`), { status: r.status, code: j.code }); }
  return r.status === 204 ? null : r.json();
}

/* ---------- Realtime: yalnızca Broadcast (veritabanı sorgulamaz, log üretmez) ---------- */
const RT = {
  ws: null, ref: 0, joinRef: null, joined: false, want: false, hb: null, backoff: 2000, rtimer: null, tokTimer: null,
  topic: 'realtime:pronto',
  start() { this.want = true; if (!this.ws) this.connect(); },
  stop() { this.want = false; clearTimeout(this.rtimer); this.ws?.close(); },
  send(o) { if (this.ws?.readyState === 1) { this.ws.send(JSON.stringify(o)); return true; } return false; },
  connect() {
    if (!navigator.onLine || !Auth.s) return;
    const ws = this.ws = new WebSocket(`${CFG.url.replace(/^http/, 'ws')}/realtime/v1/websocket?apikey=${encodeURIComponent(CFG.key)}&vsn=1.0.0`);
    ws.onopen = async () => {
      let t; try { t = await Auth.token(); } catch { return ws.close(); }
      this.joinRef = String(++this.ref);
      this.send({ topic: this.topic, event: 'phx_join', ref: this.joinRef, join_ref: this.joinRef,
        payload: { config: { broadcast: { self: false, ack: false }, presence: { key: '' }, postgres_changes: [], private: true }, access_token: t } });
      this.hb = setInterval(() => this.send({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: String(++this.ref) }), 25000);
      /* Oturum anahtarını süresi dolmadan tazele (saatte 1 istek) */
      this.tokTimer = setInterval(() => Auth.refresh().catch(() => {}), 50 * 60e3);
    };
    ws.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.topic !== this.topic) return;
      if (m.event === 'phx_reply' && m.ref === this.joinRef) {
        if (m.payload?.status === 'ok') {
          this.joined = true; this.backoff = 2000; setSync();
          /* Bağlantı koptuğu sürede kaçanları tek istekle al; sonrası yalnızca canlı yayın */
          Sync.delta().then(() => { if (this.joined) this.gapFree = true; }).catch(() => {}); Sync.flush();
        }
        else { console.warn('Realtime katılım reddedildi', m.payload); ws.close(); }
      } else if (m.event === 'broadcast' && m.payload?.event === 'rows') Sync.applyRemote(m.payload.payload?.rows || []);
      else if (m.event === 'phx_error' || m.event === 'phx_close') ws.close();
    };
    ws.onclose = () => {
      this.gapFree = false; clearInterval(this.hb); clearInterval(this.tokTimer); this.ws = null; this.joined = false; setSync();
      if (this.want) { clearTimeout(this.rtimer); this.rtimer = setTimeout(() => this.connect(), this.backoff); this.backoff = Math.min(this.backoff * 2, 120000); }
    };
  },
  setToken(t) { if (this.joined) this.send({ topic: this.topic, event: 'access_token', payload: { access_token: t }, ref: String(++this.ref), join_ref: this.joinRef }); },
  broadcast(rows) {
    if (!this.joined || !rows.length) return;
    /* Büyük fotoğraf satırları mesaja sığmazsa sadece "değişti" bilgisi gider, alan PC o satırı çeker */
    let batch = [], size = 0;
    const out = () => { if (batch.length) this.send({ topic: this.topic, event: 'broadcast', ref: String(++this.ref), join_ref: this.joinRef, payload: { type: 'broadcast', event: 'rows', payload: { rows: batch } } }); batch = []; size = 0; };
    for (const r of rows) {
      let s = JSON.stringify(r).length; let row = r;
      if (s > 90000) { row = { tbl: r.tbl, id: r.id, updated_at: r.updated_at, stub: true }; s = 200; }
      if (size + s > 90000) out();
      batch.push(row); size += s;
    }
    out();
  }
};

/* =====================================================================
   SENKRON ÇEKİRDEĞİ
   MEM: bellek; IDB: cihaz önbelleği; outbox: gönderilmeyi bekleyen değişiklikler.
   ===================================================================== */
const MEM = {};
const tableRegistry = new Map();
const IDB_NAME = 'pronto_cache_v2';
let idb = null;
function idbOpen() {
  return idb ? Promise.resolve(idb) : new Promise((ok, no) => {
    const q = indexedDB.open(IDB_NAME, 1);
    q.onupgradeneeded = () => { const d = q.result; d.createObjectStore('rows', { keyPath: 'k' }); d.createObjectStore('outbox', { keyPath: 'k' }); };
    q.onsuccess = () => ok(idb = q.result); q.onerror = () => no(q.error);
  });
}
function idbTx(store, fn) { return idbOpen().then(d => new Promise((ok, no) => { const tx = d.transaction(store, 'readwrite'); fn(tx.objectStore(store)); tx.oncomplete = ok; tx.onerror = () => no(tx.error); })); }
function idbAll(store) { return idbOpen().then(d => new Promise((ok, no) => { const q = d.transaction(store).objectStore(store).getAll(); q.onsuccess = () => ok(q.result || []); q.onerror = () => no(q.error); })); }
const mem = t => MEM[t] || (MEM[t] = new Map());
const kOf = (t, id) => t + '|' + id;

const Sync = {
  outbox: new Map(), last: Local.get('last_sync', null), lastDeltaAt: 0, busy: false, retry: null, online: navigator.onLine,
  async init() {
    for (const r of await idbAll('rows')) mem(r.tbl).set(r.id, r.data);
    for (const o of await idbAll('outbox')) { this.outbox.set(o.k, o); o.deleted ? mem(o.tbl).delete(o.id) : mem(o.tbl).set(o.id, o.data); }
  },
  drop(o) { this.outbox.delete(o.k); idbTx('outbox', s => s.delete(o.k)).catch(() => {}); },
  put(tbl, id, data) { mem(tbl).set(id, data); this.queue({ k: kOf(tbl, id), tbl, id, data, deleted: false }); },
  del(tbl, id) { mem(tbl).delete(id); this.queue({ k: kOf(tbl, id), tbl, id, data: null, deleted: true }); },
  queue(o) {
    o.v = uid(); this.outbox.set(o.k, o);
    idbTx('outbox', s => s.put(o)).catch(() => {});
    idbTx('rows', s => o.deleted ? s.delete(o.k) : s.put({ k: o.k, tbl: o.tbl, id: o.id, data: o.data })).catch(() => {});
    clearTimeout(this.ft); this.ft = setTimeout(() => this.flush(), 350); setSync();
  },
  /* Yalnızca değişen satırlar gönderilir */
  async flush() {
    if (this.busy || !this.outbox.size || !Auth.s) return;
    this.busy = true; clearTimeout(this.retry);
    try {
      while (this.outbox.size) {
        let batch = [...this.outbox.values()].slice(0, 100), res;
        const send = b => api('pt_rows?on_conflict=tbl,id&select=tbl,id,updated_at', { method: 'POST', prefer: 'resolution=merge-duplicates,return=representation',
          body: b.map(o => ({ tbl: o.tbl, id: o.id, data: o.deleted ? null : o.data, deleted: o.deleted })) });
        try { res = await send(batch); }
        catch (e) {
          if (e.status !== 400) throw e;
          /* Sunucu doğrulaması bir kaydı reddetti: tek tek gönder, geçersiz olanı at (sonsuz tekrar yok) */
          res = [];
          for (const o of batch) {
            try { res.push(...await send([o])); }
            catch (e2) { if (e2.status !== 400) throw e2; this.drop(o); toast('Geçersiz bir kayıt sunucu tarafından reddedildi: ' + e2.message, 'err'); }
          }
          batch = batch.filter(o => this.outbox.has(o.k));
        }
        const at = new Map((res || []).map(r => [kOf(r.tbl, r.id), r.updated_at]));
        const sent = [];
        for (const o of batch) {
          if (this.outbox.get(o.k)?.v === o.v) { this.outbox.delete(o.k); idbTx('outbox', s => s.delete(o.k)).catch(() => {}); }
          sent.push({ tbl: o.tbl, id: o.id, data: o.deleted ? null : o.data, deleted: o.deleted, updated_at: at.get(o.k) });
        }
        RT.broadcast(sent); this.bump(sent);
      }
      this.setOnline(true);
    } catch (e) {
      if (e instanceof NetError) this.setOnline(false); else if (!(e instanceof AuthError)) toast('Kayıt sunucuya gönderilemedi: ' + e.message, 'err');
      /* Sadece bekleyen değişiklik varsa tekrar dene (boşta trafik yok); hız sınırında 1 dk bekle */
      this.retry = setTimeout(() => this.flush(), e.status === 429 ? 60000 : 30000);
    } finally { this.busy = false; setSync(); }
  },
  /* Son eşitlemeden beri değişenleri çek (tam tarama yok) */
  async delta() {
    if (!Auth.s) return false;
    /* 5 sn geriye taşma: aynı anda kaydedilen ama geç biten işlemler kaçmasın */
    let changed = false, since = this.last ? new Date(Date.parse(this.last) - 5000).toISOString() : null;
    try {
      for (;;) {
        const q = 'pt_rows?select=tbl,id,data,deleted,updated_at&order=updated_at.asc&limit=1000' + (since ? '&updated_at=gt.' + encodeURIComponent(since) : '');
        const rows = await api(q);
        if (rows.length) {
          if (this.applyRows(rows)) changed = true;
          since = rows[rows.length - 1].updated_at;
        }
        if (rows.length < 1000) break;
      }
      if (since && (!this.last || since > this.last)) { this.last = since; Local.set('last_sync', since); } this.lastDeltaAt = Date.now(); this.setOnline(true);
    } catch (e) { if (e instanceof NetError) this.setOnline(false); else throw e; }
    if (changed) remoteChanged();
    return changed;
  },
  applyRows(rows) {
    const puts = [], dels = [];
    for (const r of rows) {
      const k = kOf(r.tbl, r.id), m = mem(r.tbl);
      if (this.outbox.has(k)) continue; /* bu cihazda gönderilmemiş daha yeni değişiklik var */
      if (r.deleted) { if (!m.has(r.id)) continue; m.delete(r.id); dels.push(k); }
      else { if (m.has(r.id) && JSON.stringify(m.get(r.id)) === JSON.stringify(r.data)) continue; m.set(r.id, r.data); puts.push({ k, tbl: r.tbl, id: r.id, data: r.data }); }
      tableRegistry.get(r.tbl)?.invalidate();
    }
    if (puts.length || dels.length) idbTx('rows', s => { puts.forEach(p => s.put(p)); dels.forEach(k => s.delete(k)); }).catch(() => {});
    return puts.length + dels.length > 0;
  },
  applyRemote(rows) {
    const full = rows.filter(r => !r.stub);
    if (full.length && this.applyRows(full)) remoteChanged();
    if (!rows.some(r => r.stub)) this.bump(rows);
    if (rows.some(r => r.stub)) this.delta().catch(() => {});
  },
  /* Canlı bağlantı kesintisizse, gelen/gönderilen satırların zamanı "son eşitleme"yi ileri alır.
     Böylece program yeniden açıldığında gün boyu değişenler tekrar indirilmez. */
  bump(rows) {
    if (!RT.gapFree) return;
    for (const r of rows) if (r.updated_at && (!this.last || r.updated_at > this.last)) this.last = r.updated_at;
    Local.set('last_sync', this.last);
  },
  setOnline(v) { if (this.online !== v) { this.online = v; setSync(); } }
};

/* Sunucu değiştiyse (taşıma sonrası) son eşitleme zamanı sıfırlanır: bir kez tam çekim */

/* ---------- tablo API'si (ekranlar bununla çalışır) ---------- */
function Table(name) {
  let arr = null;
  const t = {
    all() { return arr || (arr = [...mem(name).values()]); },
    find(id) { return mem(name).get(id); },
    upsert(row) { Sync.put(name, row.id, row); arr = null; return true; },
    remove(id) { Sync.del(name, id); arr = null; return true; },
    /* toplu kayıt: yalnızca gerçekten değişen satırlar gönderilir */
    save(rows) {
      const next = new Set(rows.map(r => r.id));
      for (const id of [...mem(name).keys()]) if (!next.has(id)) Sync.del(name, id);
      for (const r of rows) { const o = mem(name).get(r.id); if (!o || JSON.stringify(o) !== JSON.stringify(r)) Sync.put(name, r.id, r); }
      arr = null; return true;
    },
    invalidate() { arr = null; }
  };
  tableRegistry.set(name, t); return t;
}

function calc(t, pays) {
  const ana = r2(t.items.reduce((a, i) => a + (+i.fiyat || 0) * (+i.adet || 0), 0));
  const adet = t.items.reduce((a, i) => a + (+i.adet || 0), 0);
  const isk = r2(t.iskontoTip === '%' ? ana * (+t.iskontoDeger || 0) / 100 : +t.iskontoTutar || 0);
  const ara = r2(Math.max(0, ana - isk)), kdv = r2(ara * (+t.kdv || 0) / 100), genel = r2(ara + kdv);
  const pes = r2(Math.max(0, +t.pesinat || 0) + (pays || []).reduce((a, p) => a + (+p.cevrilmis || 0), 0));
  return { ana, adet, isk, ara, kdv, genel, pes, kalan: r2(genel - pes) };
}

function modal({ title, body, foot, size = '', cls = '', onMount, closeOnBg = true }) {

  mount(ov, html`<div class="mdl ${size}" role="dialog" aria-modal="true">
    ${title != null ? html`<div class="mdl-h"><h3>${title}</h3><button class="btn ghost icon sm" data-x aria-label="Kapat">${I('x')}</button></div>` : ''}
    <div class="mdl-b">${body || ''}</div>${foot ? html`<div class="mdl-f">${foot}</div>` : ''}</div>`);
  document.body.appendChild(ov);
  const onKey = e => { if (e.key === 'Escape' && document.body.lastElementChild === ov) close(); };
  const close = () => { document.removeEventListener('keydown', onKey); ov.remove(); };
  ov.addEventListener('mousedown', e => { if (closeOnBg && e.target === ov) close(); });
  ov.addEventListener('click', e => { if (e.target.closest('[data-x]')) close(); });
  document.addEventListener('keydown', onKey);
  const m = { el: ov, close, $: s => $(s, ov) };
  onMount && onMount(m);
  setTimeout(() => { const f = $('[autofocus]', ov); f && f.focus(); }, 30);
  return m;
}
function confirmBox({ title = 'Onay', body = '', ok = 'Onayla', danger = false, cancel = 'Vazgeç' }) {
  return new Promise(res => {
    let done = false;
    const m = modal({ title, size: 'sm', body, foot: html`<button class="btn" data-no>${cancel}</button><button class="btn ${danger ? 'danger solid' : 'primary'}" data-ok>${ok}</button>`,
      onMount: m => { m.el.addEventListener('click', e => { if (e.target.closest('[data-ok]')) { done = true; m.close(); res(true); } else if (e.target.closest('[data-no],[data-x]')) { done = true; m.close(); res(false); } }); } });
    m.el.addEventListener('mousedown', e => { if (e.target === m.el && !done) res(false); });
  });
}

  mount(popEl, items.map((it, i) => it === '-' ? html`<hr>` : html`<button data-i="${i}" class="${it.danger ? 'danger' : ''} ${it.on ? 'on' : ''}">${it.icon ? I(it.icon) : ''}<span>${it.label}</span></button>`));
  document.body.appendChild(popEl);

/* =====================================================================
   TEK ŞİFRE: giriş ve ayarlar aynı şifre (Supabase Auth, ortak ekip hesabı)
   Şifre cihazda saklanmaz; 3 hatalı denemede bu cihaz 15 dk kilitlenir.
   ===================================================================== */
const LOCK_MS = 15 * 60e3;
const lockState = () => Local.get('lock', { fails: 0, until: 0 });
function passPad({ title, sub = '', cancellable = true, fields = 1, submit, onCancel, button = 'Giriş Yap' }) {
  const ov = document.createElement('div'); ov.className = 'ov pin-ov';
  const ph = ['Şifre', 'Yeni şifre', 'Yeni şifre (tekrar)'];
  mount(ov, html`<div class="pin-card" role="dialog" aria-modal="true" aria-label="${title}">
    ${logoSrc() ? html`<img class="pin-logo" src="${logoSrc()}" alt="">` : html`<div class="mark">P</div>`}
    <h3>${title}</h3><p>${sub}</p>
    ${Array.from({ length: fields }, (_, i) => html`<input class="pin-entry" type="password" autocomplete="${i ? 'new-password' : 'current-password'}" maxlength="72" placeholder="${fields === 1 ? 'Şifre' : ['Mevcut şifre', ...ph.slice(1)][i]}" data-i="${i}">`)}
    <div class="pin-msg" aria-live="assertive"></div>
    <button type="button" class="pin-submit" disabled>${button}</button>
    ${cancellable ? html`<button type="button" class="pin-cancel">Vazgeç</button>` : ''}
  </div>`);
  document.body.appendChild(ov);
  let busy = false, timer = null;
  const inputs = $$('.pin-entry', ov), msg = $('.pin-msg', ov), card = $('.pin-card', ov), btn = $('.pin-submit', ov);
  const vals = () => inputs.map(i => i.value);
  const sync = () => { btn.disabled = busy || card.classList.contains('locked') || vals().some(v => v.length < 6); };
  const setLocked = until => { card.classList.add('locked'); clearInterval(timer); sync();
    const tick = () => { const s = Math.max(0, Math.ceil((until - Date.now()) / 1000)); if (!s) { clearInterval(timer); card.classList.remove('locked'); msg.textContent = ''; sync(); inputs[0].focus(); return; } msg.textContent = `Çok fazla hatalı deneme. ${Math.floor(s/60)}:${pad(s%60,2)} sonra tekrar deneyin.`; };
    tick(); timer = setInterval(tick, 1000); };
  const L = lockState(); if (L.until > Date.now()) setLocked(L.until);
  const close = () => { clearInterval(timer); document.removeEventListener('keydown', onKey); ov.remove(); };
  const press = async () => {
    if (btn.disabled) return;
    busy = true; sync(); msg.textContent = '';
    const r = await submit(...vals()); busy = false;
    if (r.ok) { close(); return; }
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    inputs.forEach(i => { i.value = ''; }); sync(); inputs[0].focus();
    if (r.locked) setLocked(r.locked); else msg.textContent = r.msg || 'Şifre yanlış';
  };
  ov.addEventListener('input', () => { msg.textContent = ''; sync(); });
  ov.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); press(); } });
  btn.addEventListener('click', press);
  const onKey = e => { if (e.key === 'Escape' && cancellable) { close(); onCancel && onCancel(); } };
  document.addEventListener('keydown', onKey);
  if (cancellable) $('.pin-cancel', ov).addEventListener('click', () => { close(); onCancel && onCancel(); });
  sync(); requestAnimationFrame(() => inputs[0].focus());
  return { close };
}
/* Şifreyi sunucuda doğrula; yanlışsa cihaz kilidi sayacı artar */
async function checkPassword(pw) {
  const L = lockState();
  if (L.until > Date.now()) return { ok: false, locked: L.until };
  try { await Auth.login(pw); Local.set('lock', { fails: 0, until: 0 }); return { ok: true }; }
  catch (e) {
    if (e instanceof NetError) return { ok: false, msg: e.message };
    L.fails++; if (L.fails >= 3) { L.fails = 0; L.until = Date.now() + LOCK_MS; }
    Local.set('lock', L); return { ok: false, locked: L.until > Date.now() ? L.until : 0 };
  }
}

/* ---------- görsel yükleme (tür + boyut + imza kontrolü, küçültme) ---------- */
async function readImage(file, { max = 320, type = 'image/jpeg' } = {}) {
  if (!file) return '';
  if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) throw new Error('Sadece JPG, PNG veya WEBP yükleyebilirsiniz.');
  if (file.size > 8 * 1024 * 1024) throw new Error('Dosya 8 MB sınırını aşıyor.');
  const head = new Uint8Array(await file.slice(0, 12).arrayBuffer());
  const isJpg = head[0] === 0xFF && head[1] === 0xD8, isPng = head[0] === 0x89 && head[1] === 0x50, isWebp = head[8] === 0x57 && head[9] === 0x45 && head[10] === 0x42 && head[11] === 0x50;
  if (!(isJpg || isPng || isWebp)) throw new Error('Dosya içeriği geçerli bir görsel değil.');
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('Görsel okunamadı.')); i.src = url; });
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const x = c.getContext('2d'); if (type === 'image/jpeg') { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); }
    x.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL(type, 0.52);
  } finally { URL.revokeObjectURL(url); }
}

const LS = { q: '', f: { cari: '', durum: '', personel: '', tarih: '', from: '', to: '' }, sort: 'tarih', dir: 'desc', limit: 20, sel: null };
function presetRange(p) {
  const d = new Date();
  if (p === 'bugun') return [isoOf(d), isoOf(d)];
  if (p === 'hafta') { const s = new Date(d); s.setDate(s.getDate() - (s.getDay() + 6) % 7); const e = new Date(s); e.setDate(s.getDate() + 6); return [isoOf(s), isoOf(e)]; }
  if (p === 'ay') return [isoOf(new Date(d.getFullYear(), d.getMonth(), 1)), isoOf(new Date(d.getFullYear(), d.getMonth() + 1, 0))];
  if (p === 'yil') return [`${d.getFullYear()}-01-01`, `${d.getFullYear()}-12-31`];
  return null;
}

function rangeOf(f) { return f.tarih === 'ozel' ? [f.from || '0000-01-01', f.to || '9999-12-31'] : presetRange(f.tarih); }

function validateTeklif(d) {
  const E = []; const add = (sel, msg) => E.push({ sel, msg });

  if (!d.teslim || d.teslim < d.tarih) add('[data-d="teslim"]', 'Teslim tarihi geçersiz.');
  if (!['dahil','haric'].includes(d.nakliye)) add('[data-d="nakliye"]', 'Nakliye seçin.');
  if (!['dahil','haric'].includes(d.montaj)) add('[data-d="montaj"]', 'Montaj seçin.');
  if (!['fabrika','adres'].includes(d.teslimYeri)) add('[data-d="teslimYeri"]', 'Teslim yeri seçin.');
  if (!d.id && !DB.cari.find(d.cariId)) add('#fCari', 'Müşteri seçin.');
  if (!d.id && !DB.personel.find(d.personelId)) add('#fPers', 'Personel seçin.');
  if (!d.items.length) add('#items', 'En az bir ürün ekleyin.');
  d.items.forEach((it, i) => {
    const s = f => `#items .it[data-idx="${i}"] [data-if="${f}"]`;
    if (!(it.adet >= 1)) add(s('adet'), 'Adet en az 1.');
    if (!(it.fiyat >= 0)) add(s('fiyat'), 'Fiyat geçersiz.');
    if (!clean(it.olcu, 80)) add(s('olcu'), 'Ölçü zorunlu.');
    if (!clean(it.renk, 80)) add(s('renk'), 'Renk zorunlu.');
    if (trLower(itemTitle(it)).includes('masa') && !['sag','sol','cift','yok'].includes(normYon(it.yon))) add(s('yon'), 'Masa yönü seçin.');
  });
  if (!(d.kdv >= 0 && d.kdv <= 100)) add('[data-d="kdv"]', 'KDV 0–100 arası olmalı.');
  if (d.pesinat > 0 && !d.pesinatTarih) add('[data-d="pesinatTarih"]', 'Peşinat tarihi zorunlu.');

/* ---- Türkiye adres listesi (il / ilçe / mahalle / posta kodu)
   Kaynak: PTT resmî listesi; GitHub 6 ayda bir yeniler. Veri Supabase'den değil sitenin
   kendisinden gelir. Bir ilin dosyası yalnızca o il seçildiğinde indirilir ve cihazda
   6 ay saklanır — bu sürede o il için hiç istek yapılmaz. */
const ADRES_TTL = 182 * 864e5;
const trSlug = s => trLower(s).replace(/[çğıöşüâîû]/g, c => ({ ç: 'c', ğ: 'g', ı: 'i', ö: 'o', ş: 's', ü: 'u', â: 'a', î: 'i', û: 'u' }[c])).replace(/[^a-z0-9]/g, '');
const Adres = {
  mem: new Map(), dbp: null,
  db() {
    return this.dbp ||= new Promise((ok, no) => { const q = indexedDB.open('pronto_adres', 1); q.onupgradeneeded = () => q.result.createObjectStore('il'); q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error); });
  },
  async get(k) { try { const db = await this.db(); return await new Promise(ok => { const r = db.transaction('il').objectStore('il').get(k); r.onsuccess = () => ok(r.result || null); r.onerror = () => ok(null); }); } catch { return null; } },
  async set(k, v) { try { const db = await this.db(); db.transaction('il', 'readwrite').objectStore('il').put(v, k); } catch { /* önbellek yoksa her seferinde indirilir */ } },
  valid(d) { return d && Array.isArray(d.ilceler) && d.ilceler.every(x => Array.isArray(x) && typeof x[0] === 'string' && Array.isArray(x[1])); },
  async il(name) {
    if (!ILLER.includes(name)) return null;
    const k = trSlug(name);
    if (this.mem.has(k)) return this.mem.get(k);
    let rec = await this.get(k);
    if (!rec || !this.valid(rec.d) || Date.now() - rec.t > ADRES_TTL) {
      try {
        const r = await fetch(`adres/${k}.json`);
        if (!r.ok) throw new Error(r.status);
        const d = await r.json(); if (!this.valid(d)) throw new Error('biçim');
        rec = { t: Date.now(), d }; this.set(k, rec);
      } catch (e) { if (!rec) return null; }   // çevrimdışı: eski liste kullanılır
    }
    const ilceler = rec.d.ilceler.map(([ad, mah]) => ({ ad: clean(ad, 60), mah: mah.filter(Array.isArray).map(([m, pk]) => ({ ad: clean(m, 80), pk: /^\d{5}$/.test(pk) ? pk : '' })) }));
    const out = { v: clean(rec.d.v, 10), ilceler };
    this.mem.set(k, out); return out;
  }
};

function repData() {

function repTable(tab, D) {

  }

}

function setupScreen() {
  mount(app, html`<div class="setup card"><h2 style="margin-bottom:6px">PRONTO — İlk kurulum</h2>
    <p class="muted sm" style="margin-top:0">Bu bilgisayarda bir kez yapılır. Bilgiler Supabase → Project Settings → API sayfasındadır.</p>
    <div class="grid"><div class="field"><label>Supabase adresi (Project URL)</label><input class="inp" data-case="keep" data-s="url" placeholder="https://xxxx.supabase.co" autofocus></div>
      <div class="field"><label>Anon (public) anahtar</label><input class="inp" data-case="keep" data-s="key" placeholder="eyJ…"></div>
      <div class="field"><label>Ekip hesabı e-postası</label><input class="inp" data-case="keep" inputmode="email" data-s="email" value="${CFG.email}"></div></div>
    <div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn primary" data-save>Kaydet ve devam et</button></div></div>`);
  $('[data-save]', app).addEventListener('click', () => {
    const g = k => $(`[data-s="${k}"]`, app).value.trim();
    const url = g('url').replace(/\/+$/, ''), key = g('key'), email = g('email');
    if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)) return toast('Adres https://xxxx.supabase.co biçiminde olmalı', 'err');
    if (key.split('.').length !== 3 && !/^sb_publishable_/.test(key)) return toast('Anahtar geçersiz görünüyor', 'err');
    if (!V.email(email) || !email) return toast('E-posta geçersiz', 'err');
    Local.set('cfg', { url, key, email }); location.reload();
  });
}

async function boot() {

  try { await Sync.init(); } catch (e) { console.warn('Önbellek açılamadı', e); }
  loadSettings(); applyTheme();

}
/* Metin alanlarında küçük harfi büyük harfe çevir (e-posta, şifre ve data-case="keep" hariç) */
document.addEventListener('input', e => {
  const el = e.target;
  if (!(el instanceof HTMLInputElement || el instanceof HTMLTextAreaElement)) return;
  if (['date', 'number', 'radio', 'checkbox', 'file', 'password', 'color', 'range', 'email'].includes(el.type) || el.inputMode === 'email' || el.dataset.case === 'keep') return;
  const pos = el.selectionStart, up = el.value.toLocaleUpperCase('tr-TR');
  if (up !== el.value) { el.value = up; try { el.setSelectionRange(pos, pos); } catch {} }
}, true);
boot();
