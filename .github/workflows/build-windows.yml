name: Build and Release PRONTO SİPARİŞ V111

on:
  push:
    paths:
      - "release-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ImageMagick
        run: choco install imagemagick.app -y --no-progress

      - name: Create orange Windows icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          magick build/icon.svg -define icon:auto-resize=256,128,64,48,32,16 build/icon.ico

      - name: Install dependencies
        run: npm install

      - name: Build and publish Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
