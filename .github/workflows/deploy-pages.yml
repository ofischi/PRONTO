name: Siteyi yayinla ve bildir

# index.html, config.js veya adres listesi değişince siteyi yayınlar.
# Sürüm damgası yalnızca index.html + config.js'ten hesaplanır: sadece adres listesi
# değiştiğinde programlarda "yeni sürüm" bildirimi çıkmaz.
on:
  push:
    branches: [main]
    paths: ['index.html', 'config.js', 'adres/*.json', 'manifest.webmanifest', '*.png']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    env:
      SB_URL: ${{ secrets.SUPABASE_URL }}
      SB_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Yayin klasoru + surum damgasi
        run: |
          mkdir _site
          cp index.html config.js _site/
          # telefona kurulum: uygulama tanımı + simgeler (varsa)
          for f in manifest.webmanifest apple-touch-icon.png ikon-64.png ikon-192.png ikon-512.png ikon-maskable-512.png; do if [ -f "$f" ]; then cp "$f" _site/; fi; done
          mkdir _site/adres && cp adres/*.json _site/adres/
          V=$(cat index.html config.js | sha256sum | cut -c1-7)
          echo "V=$V" >> "$GITHUB_ENV"
          sed -i "s/const BUILD = '__BUILD__'/const BUILD = '$V'/" _site/index.html
          grep -q "const BUILD = '$V'" _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4

      - name: Acik programlara bildirim
        if: ${{ env.SB_URL != '' && env.SB_KEY != '' }}
        run: |
          H=(-H "apikey: $SB_KEY" -H "Content-Type: application/json")
          [[ "$SB_KEY" == eyJ* ]] && H+=(-H "Authorization: Bearer $SB_KEY")
          ROW=$(curl -sSf "${H[@]}" -H "Prefer: resolution=merge-duplicates,return=representation" \
            "$SB_URL/rest/v1/pt_rows?on_conflict=tbl,id&select=tbl,id,data,deleted,updated_at" \
            -d "[{\"tbl\":\"meta\",\"id\":\"app_version\",\"data\":{\"sha\":\"$V\"},\"deleted\":false}]")
          MSG=$(jq -c '{messages:[{topic:"pronto",event:"rows",private:true,payload:{rows:.}}]}' <<<"$ROW")
          curl -sSf "${H[@]}" "$SB_URL/realtime/v1/api/broadcast" -d "$MSG"
          echo "Bildirim gonderildi: $V"
