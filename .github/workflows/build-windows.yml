name: PRONTO Windows kurulum dosyası

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Simge (svg -> ico)
        shell: pwsh
        run: |
          choco install imagemagick.app -y --no-progress
          $env:Path += ";" + (Get-ChildItem "C:\Program Files\ImageMagick*" | Select-Object -First 1).FullName
          magick build/icon.svg -define icon:auto-resize=256,128,64,48,32,16 build/icon.ico
      - run: npm install
      - name: Derle ve Releases'e yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
