name: Adres listesini guncelle

# 6 ayda bir (1 Ocak ve 1 Temmuz) il / ilçe / mahalle / köy listesini yeniler.
# Kaynak: TÜİK MEDAS verisi — github.com/ubeydeozdmr/turkiye-api (MIT lisans).
# Liste değiştiyse il dosyalarını günceller ve siteyi yeniden yayınlar; değişmediyse hiçbir şey yapmaz.
# Actions sekmesinden "Run workflow" ile elle de çalıştırılabilir.
on:
  schedule:
    - cron: '17 3 1 1,7 *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: adres
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: TUIK verisini indir
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/ubeydeozdmr/turkiye-api.git kaynak
          git -C kaynak sparse-checkout set datasets
          echo "Kaynak surumu: $(git -C kaynak log -1 --format='%h %cd' --date=short)"
          ls kaynak/datasets

      - name: Il dosyalarini uret
        run: |
          YIL=$(ls kaynak/datasets | grep -E '^[0-9]{4}$' | sort | tail -1)
          python3 adres/uret.py --tuik kaynak/datasets --out adres --surum "$YIL"
          rm -rf kaynak

      - name: Degistiyse kaydet ve siteyi yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- adres && [ -z "$(git ls-files --others --exclude-standard adres)" ]; then
            echo "Liste degismemis, bir sey yapilmadi."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adres
          git commit -m "Adres listesi guncellendi ($(date +%F))"
          git push
          gh workflow run deploy-pages.yml --ref "${GITHUB_REF_NAME}"
