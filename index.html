<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; connect-src 'self' https://yxkaohidodevfwzfbkol.supabase.co wss://yxkaohidodevfwzfbkol.supabase.co">
<title>PRONTO SİPARİŞ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#c9a24a;--btn:#c9a24a;--menu-w:248px;--menu-font:15px;--logo-size:40px;--brand-size:13px;--brand-weight:600;--brand-color:var(--muted);
--r-lg:16px;--r:12px;--r-sm:8px;--font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
--ok:#3fb67a;--warn:#e0a53a;--info:#4f8fe6;--vio:#9a7bea;--err:#e05a5a;color-scheme:dark}
[data-theme=dark]{--bg:#0e1116;--bg2:#141821;--surface:rgba(255,255,255,.035);--surface-2:rgba(255,255,255,.07);--border:rgba(255,255,255,.08);--border-2:rgba(255,255,255,.15);--text:#e7e4dc;--muted:#8c8f98;--glass:rgba(20,24,32,.72);--shadow:0 18px 50px rgba(0,0,0,.5);--hover:rgba(255,255,255,.04);--input:rgba(255,255,255,.045);--zebra:rgba(255,255,255,.018);color-scheme:dark}
[data-theme=light]{--bg:#eef0f3;--bg2:#ffffff;--surface:#ffffff;--surface-2:#f2f3f6;--border:rgba(16,22,34,.09);--border-2:rgba(16,22,34,.18);--text:#1a1d24;--muted:#6b707c;--glass:rgba(255,255,255,.8);--shadow:0 16px 40px rgba(20,26,40,.14);--hover:rgba(16,22,34,.035);--input:#fff;--zebra:rgba(16,22,34,.02);color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 500px at 12% -10%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 70%),radial-gradient(700px 500px at 110% 110%,color-mix(in srgb,var(--info) 7%,transparent),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:22px}h2{font-size:17px}h3{font-size:15px}
.muted{color:var(--muted)}.sm{font-size:12.5px}.b{font-weight:700}.r{text-align:right}.nowrap{white-space:nowrap}
.hidden{display:none!important}
svg.i{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.app{position:relative;display:flex;height:100%;overflow:hidden}
.side{width:var(--menu-w);flex-shrink:0;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-right:1px solid var(--border);transition:width .25s ease,transform .25s ease,opacity .25s;z-index:40;overflow:hidden}
.side-top{padding:14px 14px 10px;display:flex;flex-direction:column;gap:14px}
.ham{width:34px;height:34px;display:grid;place-items:center;border-radius:var(--r-sm);border:1px solid var(--border);background:transparent;color:var(--muted)}
.ham:hover{color:var(--text);background:var(--hover)}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px;user-select:none;-webkit-user-select:none;touch-action:none;position:relative;padding:4px 2px;border-radius:var(--r-sm);-webkit-touch-callout:none}
.brand img,.brand .mark{height:var(--logo-size);max-width:100%;object-fit:contain}
.mark{aspect-ratio:1;display:grid;place-items:center;border-radius:11px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 95%,#fff),color-mix(in srgb,var(--accent) 70%,#000));color:#1b1407;font-weight:800;font-size:calc(var(--logo-size)*.5)}
.brand-text{font-size:var(--brand-size);font-weight:var(--brand-weight);color:var(--brand-color);letter-spacing:.14em}
.nav{flex:1;padding:8px 10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;overflow-x:hidden}
.nav-item{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r);border:0;background:transparent;color:var(--muted);font-size:var(--menu-font);font-weight:600;text-align:left;white-space:nowrap;transition:background .15s,color .15s}
.nav-item::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--accent);opacity:0;transition:opacity .15s}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item:hover::before{opacity:.45}
.nav-item.active{background:color-mix(in srgb,var(--accent) 11%,transparent);color:var(--accent)}
.nav-item.active::before{opacity:1;box-shadow:0 0 10px var(--accent)}
.nav-item svg.i{width:20px;height:20px}
.side-bot{padding:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:3px}
.tgl{margin-left:auto;width:34px;height:20px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border-2);position:relative;flex-shrink:0}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.tgl.on::after{transform:translateX(14px);background:var(--accent)}
.side.collapsed{width:68px}
.side.collapsed .lbl,.side.collapsed .brand-text,.side.collapsed .tgl{display:none}
.side.collapsed .nav-item{justify-content:center;padding:11px 0}
.side.collapsed .side-top{align-items:center}
.side.collapsed .brand{align-items:center}
.side.collapsed .brand img,.side.collapsed .brand .mark{height:34px}
.backdrop{position:fixed;inset:0;background:rgba(5,7,10,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:35}
.tip{position:fixed;z-index:90;display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:10px;background:var(--glass);border:1px solid var(--border-2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shadow);font-weight:600;font-size:13px;opacity:0;transform:translateX(-4px);transition:opacity .15s,transform .15s;pointer-events:none}
.tip.show{opacity:1;transform:none}
@media (max-width:1099px){
 .side{width:68px}
 .side:not(.open) .lbl,.side:not(.open) .brand-text,.side:not(.open) .tgl{display:none}
 .side:not(.open) .nav-item{justify-content:center;padding:11px 0}
 .side:not(.open) .side-top,.side:not(.open) .brand{align-items:center}
 .side:not(.open) .brand img,.side:not(.open) .brand .mark{height:34px}
 .side.open{position:fixed;left:0;top:0;bottom:0;width:min(80vw,280px);box-shadow:var(--shadow);animation:slidein .25s ease}
 .side.open~.backdrop{opacity:1;pointer-events:auto}
 .app{padding-left:68px}
 .app>.side{position:fixed;left:0;top:0;bottom:0}
}
@keyframes slidein{from{opacity:.4;transform:translateX(-24px)}to{opacity:1;transform:none}}
@media (max-width:560px){.side:not(.open){width:56px}.app{padding-left:56px}}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.page{flex:1;overflow:auto;padding:24px 28px 40px}
.page.fill{display:flex;flex-direction:column;overflow:hidden;padding-bottom:16px}
@media (max-width:767px){.page{padding:16px 14px 32px}.page.fill{padding-bottom:10px}}
.ph{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.ph-l{display:flex;align-items:center;gap:12px;min-width:0}
.ph-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--border-2);background:var(--surface);color:var(--text);font-weight:600;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.primary{background:var(--btn);border-color:transparent;color:#17120a}
.btn.primary:hover{background:color-mix(in srgb,var(--btn) 88%,#fff)}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent)}
.btn.danger.solid{background:var(--err);color:#fff;border-color:transparent}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.icon{width:38px;padding:0}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.icon.sm{width:30px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:12.5px;color:var(--muted);font-weight:600}
.field>label .req{color:var(--accent)}
.inp,select.inp,textarea.inp{width:100%;height:38px;padding:0 11px;border-radius:var(--r-sm);border:1px solid var(--border-2);background:var(--input);outline:none;transition:border-color .15s,box-shadow .15s}
textarea.inp{height:auto;min-height:62px;padding:9px 11px;resize:vertical;line-height:1.45}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.inp:disabled{opacity:.5}
.inp.bad{border-color:var(--err)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 16px,calc(100% - 11px) 16px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
select.inp option{background:var(--bg2);color:var(--text)}
.pickbtn{justify-content:space-between;width:100%;font-weight:500;background:var(--input)}
.pickbtn .ph{margin:0}
.err-t{color:var(--err);font-size:12px;min-height:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}}
.search{position:relative;flex:1;min-width:180px;max-width:420px}
.search svg{position:absolute;left:11px;top:10px;color:var(--muted)}
.search .inp{padding-left:36px}
.radio-row{display:flex;gap:16px;flex-wrap:wrap}
.radio{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13.5px}
.radio input{appearance:none;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--border-2);margin:0;display:grid;place-items:center}
.radio input:checked{border-color:var(--accent)}
.radio input:checked::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--border-2);border-radius:var(--r-sm);overflow:hidden;flex-shrink:0}
.seg button{border:0;background:transparent;padding:0 12px;height:36px;font-weight:600;color:var(--muted)}
.seg button.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px}
.card+.card{margin-top:14px}
.dgrid>.card,.stats>.card{margin-top:0}
.page.detail{display:flex;flex-direction:column;padding-bottom:0}
.page.detail .totbar{margin-bottom:0!important}
.page.detail>*{flex-shrink:0}
.page.detail .tw{flex:none}
.page.detail .totbar{margin-top:auto}
.page.detail>.tw,.page.detail>.empty{margin-bottom:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tags:empty{display:none}
.ftag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:20px;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent);font-size:12px;font-weight:600}
.st{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;border:1px solid}
.st-Beklemede{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.st-Üretimde{color:var(--info);border-color:color-mix(in srgb,var(--info) 40%,transparent);background:color-mix(in srgb,var(--info) 10%,transparent)}
.st-Sevkiyata{color:var(--vio);border-color:color-mix(in srgb,var(--vio) 40%,transparent);background:color-mix(in srgb,var(--vio) 10%,transparent)}
.st-Teslim{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.st-İptal{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent);background:color-mix(in srgb,var(--err) 10%,transparent)}

/* ---------- tables ---------- */
.tw{flex:1;min-height:0;overflow:auto;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface)}
.page:not(.fill) .tw{max-height:none}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{position:sticky;top:0;z-index:2;background:var(--bg2);text-align:left;font-weight:700;color:var(--muted);font-size:12px;border-bottom:1px solid var(--border);padding:0;white-space:nowrap}
.tbl{table-layout:fixed;min-width:1645px}
.tbl th .thi{resize:none;overflow:hidden;padding:10px 12px;min-width:0}
/* Teklifler tablosu: sütun genişlikleri sabittir, kullanıcı tarafından sürüklenemez. */
.tbl th:nth-child(1),.tbl td:nth-child(1){width:78px}
.tbl th:nth-child(2),.tbl td:nth-child(2){width:135px}
.tbl th:nth-child(3),.tbl td:nth-child(3){width:78px}
.tbl th:nth-child(4),.tbl td:nth-child(4){width:112px}
.tbl th:nth-child(5),.tbl td:nth-child(5){width:120px}
.tbl th:nth-child(6),.tbl td:nth-child(6){width:112px}
.tbl th:nth-child(7),.tbl td:nth-child(7){width:100px}
.tbl th:nth-child(8),.tbl td:nth-child(8){width:120px}
.tbl th:nth-child(9),.tbl td:nth-child(9){width:120px}
.tbl th:nth-child(10),.tbl td:nth-child(10){width:110px}
.tbl th:nth-child(11),.tbl td:nth-child(11){width:105px}
.tbl th:nth-child(12),.tbl td:nth-child(12){width:105px}
.tbl th:nth-child(13),.tbl td:nth-child(13){width:120px}
.tbl th:nth-child(14),.tbl td:nth-child(14){width:82px}
.tbl th:nth-child(15),.tbl td:nth-child(15){width:100px}
.tbl th:nth-child(16),.tbl td:nth-child(16){width:58px}
.tbl th.r .thi{text-align:right}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.tbl tbody tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover{background:var(--hover)}
.tbl tbody tr.sel{background:color-mix(in srgb,var(--accent) 7%,transparent);box-shadow:inset 2px 0 0 var(--accent)}
.tbl.static tbody tr{cursor:default}
.tbl td.wrap{white-space:normal}
.cards{display:none;gap:10px;padding:10px}
.lcard{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.lcard .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lcard .ttl{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:767px){.tw .tbl.resp{display:none}.tw .cards{display:grid}.tw{background:transparent;border:0}.tw .cards{padding:0}}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.more-l{padding:12px;text-align:center;color:var(--muted);font-size:12px}
.thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--surface-2);border:1px solid var(--border);flex-shrink:0;display:grid;place-items:center;color:var(--muted);font-size:9px;text-align:center;line-height:1.1}
img.thumb{cursor:zoom-in}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(5,7,10,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
@keyframes zoom{from{opacity:0;transform:scale(.96)}}
.mdl{width:min(560px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--border-2);border-radius:var(--r-lg);box-shadow:var(--shadow);animation:zoom .2s ease;overflow:hidden}
.mdl.lg{width:min(820px,100%)}.mdl.sm{width:min(400px,100%)}
.mdl-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.mdl-b{padding:16px;overflow:auto}
.mdl-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border);flex-wrap:wrap}
/* Teklif hızlı detay paneli */
.detail-panel-ov{justify-content:flex-end;place-items:stretch;padding:0;background:rgba(5,7,10,.35)}
.detail-panel-ov .mdl{width:min(560px,92vw);height:100dvh;max-height:none;border-radius:18px 0 0 18px;animation:slideInRight .2s ease}
.detail-panel-ov .mdl-b{padding:18px 20px}
.detail-panel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.detail-panel-card{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:12px}
.detail-panel-card .lbl{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.detail-panel-card .val{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.detail-panel-items{display:flex;flex-direction:column;gap:8px}
.detail-panel-item{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--border);border-radius:12px;padding:8px;background:var(--surface)}
.detail-panel-item img,.detail-panel-item .phx{width:56px;height:56px;border-radius:9px;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-size:10px}
.detail-panel-item .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-panel-item .meta{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-panel-item .price{text-align:right;font-weight:800;white-space:nowrap}
@keyframes slideInRight{from{transform:translateX(100%);opacity:.6}to{transform:translateX(0);opacity:1}}
@media(max-width:640px){.detail-panel-ov .mdl{width:100vw;border-radius:0}.detail-panel-grid{grid-template-columns:1fr}.detail-panel-item{grid-template-columns:48px minmax(0,1fr);}.detail-panel-item .price{grid-column:2;text-align:left}}
@media (max-width:560px){.ov{padding:8px;align-items:end}.mdl{max-height:calc(100dvh - 16px)}}
.pin-ov{z-index:80;background:rgba(18,20,24,.22);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);place-items:center;padding:16px}
.pin-card{width:min(360px,calc(100vw - 32px));padding:40px 32px 34px;border-radius:24px;background:#fff;border:1px solid rgba(28,28,30,.08);box-shadow:0 18px 50px rgba(20,24,32,.16);text-align:center;animation:zoom .2s ease;color:#252525}
.pin-card .pin-logo{width:248px;height:68px;object-fit:contain;display:block;margin:0 auto 24px;border-radius:12px}
.pin-card .mark{width:248px;height:68px;margin:0 auto 24px;border-radius:12px}
.pin-card h3{font-size:23px;line-height:1.2;font-weight:700;margin:0;color:#252525;letter-spacing:-.3px}
.pin-card p{margin:8px 0 20px;min-height:18px;font-size:15px;color:#747474}
.pin-entry{width:100%;height:52px;border:1px solid #dedede;border-radius:12px;background:#fff;color:#333;text-align:center;font-size:17px;outline:none;box-sizing:border-box;transition:border-color .15s,box-shadow .15s}

function Table(name) {
  let cache = null;
  const table={
    all() { if (!cache) cache = Store.get(name, []); return cache; },
    save(rows) { if (Store.set(name, rows)) { cache = rows; return true; } return false; },
    find(id) { return this.all().find(r => r.id === id); },
    upsert(row) { const rows = [...this.all()]; const i = rows.findIndex(r => r.id === row.id); if (i >= 0) rows[i] = row; else rows.push(row); return this.save(rows); },

    invalidate(value) { cache = Array.isArray(value) ? value : null; }

function calc(t, pays) {
  const ana = r2(t.items.reduce((a, i) => a + (+i.fiyat || 0) * (+i.adet || 0), 0));
  const adet = t.items.reduce((a, i) => a + (+i.adet || 0), 0);

  const isk = r2(t.iskontoTip === '%' ? pctIsk : tutarIsk);

}

function pinPad({ title, sub = '', lockKind = null, cancellable = true, submit, onCancel }) {
  const ov = document.createElement('div'); ov.className = 'ov pin-ov';
  mount(ov, html`<div class="pin-card" role="dialog" aria-modal="true" aria-label="${title}">

    <h3>${title}</h3><p>${sub}</p>
    <input class="pin-entry" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="4" placeholder="Parola" aria-label="${title} parolası">
    <div class="pin-msg" aria-live="assertive"></div>
    <button type="button" class="pin-submit" disabled>Giriş Yap</button>
    ${cancellable ? html`<button type="button" class="pin-cancel">Vazgeç</button>` : ''}
  </div>`);
  document.body.appendChild(ov);
  let pin = '', busy = false, timer = null;
  const input = $('.pin-entry', ov), msg = $('.pin-msg', ov), card = $('.pin-card', ov), btn = $('.pin-submit', ov);
  const sync = () => { input.value = pin; btn.disabled = pin.length !== 4 || busy || card.classList.contains('locked'); };
  const setLocked = until => { card.classList.add('locked'); clearInterval(timer); sync();
    const tick = () => { const s = Math.max(0, Math.ceil((until - Date.now()) / 1000)); if (!s) { clearInterval(timer); card.classList.remove('locked'); msg.textContent = ''; sync(); input.focus(); return; } msg.textContent = `Çok fazla hatalı deneme. ${Math.floor(s/60)}:${pad(s%60,2)} sonra tekrar deneyin.`; };
    tick(); timer = setInterval(tick, 1000); };
  if (lockKind) { const L = getSec()?.lock?.[lockKind]; if (L && L.until > Date.now()) setLocked(L.until); }
  const close = () => { clearInterval(timer); document.removeEventListener('keydown', onKey); ov.remove(); };
  const press = async () => {
    if (busy || card.classList.contains('locked') || pin.length !== 4) return;
    busy = true; sync();
    const r = await submit(pin); busy = false;
    if (r.ok) { close(); return; }
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); navigator.vibrate?.(90);
    pin = ''; sync(); input.focus(); if (r.locked) setLocked(r.locked); else msg.textContent = r.msg || 'PIN yanlış';
  };
  input.addEventListener('input', e => {
    const v = String(e.target.value || '').replace(/\D/g, '').slice(0, 4);
    pin = v; e.target.value = v; msg.textContent = ''; sync();
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); press(); } });
  btn.addEventListener('click', press);
  const onKey = e => { if (e.key === 'Escape' && cancellable) { close(); onCancel && onCancel(); } };
  document.addEventListener('keydown', onKey);
  ov.addEventListener('click', e => { if (e.target === ov && cancellable) { close(); onCancel && onCancel(); } });
  if (cancellable) ov.querySelector('.pin-cancel')?.addEventListener('click', () => { close(); onCancel && onCancel(); });
  sync();
  requestAnimationFrame(() => input.focus());
  return { close };
}

async function readImage(file, { max = 320, type = 'image/jpeg' } = {}) {
  if (!file) return '';
  if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) throw new Error('Sadece JPG, PNG veya WEBP yükleyebilirsiniz.');
  if (file.size > 8 * 1024 * 1024) throw new Error('Dosya 8 MB sınırını aşıyor.');
  const head = new Uint8Array(await file.slice(0, 12).arrayBuffer());
  const isJpg = head[0] === 0xFF && head[1] === 0xD8, isPng = head[0] === 0x89 && head[1] === 0x50, isWebp = head[8] === 0x57 && head[9] === 0x45 && head[10] === 0x42 && head[11] === 0x50;
  if (!(isJpg || isPng || isWebp)) throw new Error('Dosya içeriği geçerli bir görsel değil.');
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('Görsel okunamadı.')); i.src = url; });
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const x = c.getContext('2d'); if (type === 'image/jpeg') { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); }
    x.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL(type, 0.52);
  } finally { URL.revokeObjectURL(url); }
}

function repTable(tab, D) {

  }

    const g = {}; for (const { t } of ts) for (const it of t.items) { const k = [it.kategori, it.model, it.modul].filter(Boolean).join(' '); const s = g[k] ||= { kat: it.kategori, adet: 0, tk: new Set(), top: {} }; s.adet += +it.adet || 0; s.tk.add(t.id); addTo(s.top, t.doviz, it.fiyat * it.adet); }
    return { title: 'Ürün raporu', cols: ['Ürün', 'Kategori', 'Toplam Adet', 'Teklif Sayısı', 'Satır Toplamı (KDV hariç)'], rows: Object.entries(g).sort((a, b) => b[1].adet - a[1].adet).map(([k, s]) => [k, s.kat, s.adet, s.tk.size, fmtMulti(s.top)]) };

  return null;

async function changePin(kind) {

  const s = getSec(); if (await hashPin(a, s[other].salt) === s[other].hash) return toast('İki PIN aynı olamaz. Farklı bir PIN seçin.', 'err');

}

function blankShell() { mount(app, html`<div style="flex:1"></div>`); }
async function setupFlow() {
  blankShell();
  let lp, sp;
  for (;;) { const a = await askPin({ title: 'Giriş PIN\'i belirleyin', sub: 'Uygulamayı açarken kullanılacak 4 haneli PIN' }); const b = await askPin({ title: 'Giriş PIN\'i', sub: 'Onaylamak için tekrar girin' }); if (a === b) { lp = a; break; } toast('PIN\'ler eşleşmedi, tekrar deneyin', 'err'); }
  for (;;) { const a = await askPin({ title: 'Ayarlar PIN\'i belirleyin', sub: 'Giriş PIN\'inden farklı olmalı' }); if (a === lp) { toast('Ayarlar PIN\'i, Giriş PIN\'i ile aynı olamaz', 'err'); continue; } const b = await askPin({ title: 'Ayarlar PIN\'i', sub: 'Onaylamak için tekrar girin' }); if (a === b) { sp = a; break; } toast('PIN\'ler eşleşmedi, tekrar deneyin', 'err'); }
  const s1 = randHex(16), s2 = randHex(16);
  saveSec({ login: { salt: s1, hash: await hashPin(lp, s1) }, settings: { salt: s2, hash: await hashPin(sp, s2) }, lock: { login: { fails: 0, until: 0 }, settings: { fails: 0, until: 0 } }, devices: [] });
  await registerDevice(); seed(); startApp(); toast('PIN\'ler kaydedildi. Hoş geldiniz.');
}
function loginFlow() {
  document.querySelectorAll('.ov').forEach(o => o.remove()); closePop(); blankShell();
  pinPad({ title: 'PRONTO SİPARİŞ', sub: 'Giriş PIN\'inizi girin', lockKind: 'login', cancellable: false, submit: async p => { const r = await verifyPin('login', p); if (r.ok) { await registerDevice(); startApp(); } return r; } });
}
function startApp() { renderShell(); go('teklifler'); }
function seed() {
  if (Store.get('seeded', false)) return; Store.set('seeded', true);
  DB.yontem.save(['Nakit', 'Havale', 'Kart', 'Çek'].map((ad, i) => ({ id: uid(), ad, aciklama: '', sira: i })));
}
async function boot() {

  await initCloudSync();

  if (!window.crypto?.subtle) { mount(app, html`<div class="empty" style="margin:auto"><b>Güvenli bağlantı gerekli</b>PRONTO SİPARİŞ'i HTTPS üzerinden veya doğrudan dosya olarak açın.</div>`); return; }

}
window.addEventListener('resize', debounce(() => { if (innerWidth >= 1100) closeMenu(); }, 150));
// Uygulamadaki tüm metin alanlarında küçük harfi anında büyük harfe çevir.
document.addEventListener('input', e => {
  const el = e.target;
  if (!(el instanceof HTMLInputElement || el instanceof HTMLTextAreaElement)) return;
  if (el.type === 'date' || el.type === 'number' || el.type === 'radio' || el.type === 'checkbox' || el.type === 'file' || el.type === 'password') return;
  if (typeof el.value !== 'string') return;
  const pos = typeof el.selectionStart === 'number' ? el.selectionStart : null;
  const upper = el.value.toLocaleUpperCase('tr-TR');
  if (upper !== el.value) { el.value = upper; if (pos != null) { try { el.setSelectionRange(pos, pos); } catch (_) {} } }
}, true);
boot();
