name: Adres listesini guncelle

# 6 ayda bir (1 Ocak ve 1 Temmuz) PTT'nin resmî posta kodu listesini indirir,
# il başına küçük dosyalar üretir; liste değiştiyse siteyi yeniden yayınlar.
# Actions sekmesinden "Run workflow" ile elle de çalıştırılabilir.
on:
  schedule:
    - cron: '17 3 1 1,7 *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: adres
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: PTT listesini indir
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36"
          # PTT sunucusu sertifika zincirini eksik gönderiyor: -k gerekli (liste ayrıca denetleniyor)
          get() { curl -fsSL -k --retry 2 --retry-delay 10 -m 180 -A "$UA" -e "https://postakodu.ptt.gov.tr/" -o "$2" "$1"; }
          iszip() { [ -s "$1" ] && head -c 2 "$1" | grep -q PK; }
          get "https://postakodu.ptt.gov.tr/Dosyalar/pk_list.zip" pk_list.zip || true
          if ! iszip pk_list.zip; then
            echo "::warning::Bilinen adres zip dondurmedi. Gelen sayfa:"
            head -c 600 pk_list.zip | tr -d '\r'; echo
            get "https://postakodu.ptt.gov.tr/" ana.html || true
            echo "--- Ana sayfadaki dosya baglantilari:"
            grep -oiE 'href="[^"]+\.(zip|xlsx?)"' ana.html | sed -E 's/^href="//I; s/"$//' | sort -u | tee linkler.txt || true
            while read -r L; do
              case "$L" in http*) U="$L" ;; /*) U="https://postakodu.ptt.gov.tr$L" ;; *) U="https://postakodu.ptt.gov.tr/$L" ;; esac
              echo "Deneniyor: $U"
              if get "$U" pk_list.zip && iszip pk_list.zip; then echo "Bulundu: $U"; break; fi
            done < linkler.txt
          fi
          ls -la pk_list.zip
          iszip pk_list.zip || { echo "::error::PTT listesi indirilemedi (zip degil)"; exit 1; }

      - name: Il dosyalarini uret
        run: python3 adres/uret.py --ptt pk_list.zip --out adres

      - name: Degistiyse kaydet ve siteyi yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Yalnızca sürüm tarihi değiştiyse (liste aynıysa) hiçbir şey yapma
          if git diff --quiet -- adres ':(exclude)adres/surum.json' && ! git ls-files --others --exclude-standard adres | grep -q .; then
            git checkout -- adres; echo "Liste degismemis."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adres
          git commit -m "Adres listesi guncellendi ($(date +%F))"
          git push
          gh workflow run deploy-pages.yml --ref "${GITHUB_REF_NAME}"
