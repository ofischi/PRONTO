name: Siteyi yayinla ve bildir

# index.html, config.js veya adres listesi değişince siteyi yayınlar.
# Sürüm damgası yalnızca index.html + config.js'ten hesaplanır: sadece adres listesi
# değiştiğinde programlarda "yeni sürüm" bildirimi çıkmaz.
# Kütüphaneler (PDF, Excel) sabit sürümle npm'den doğrulanarak indirilir ve sitenin kendi lib/
# klasöründen sunulur; dış CDN'e bağımlılık yoktur. İndirilemezse yayın durur, eski site kalır.
on:
  push:
    branches: [main]
    paths: ['index.html', 'config.js', 'adres/*.json', 'manifest.webmanifest', '*.png', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    env:
      SB_URL: ${{ secrets.SUPABASE_URL }}
      SB_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Yayin klasoru + surum damgasi
        run: |
          mkdir _site
          cp index.html config.js _site/
          # telefona kurulum: uygulama tanımı + simgeler (varsa)
          for f in manifest.webmanifest apple-touch-icon.png ikon-64.png ikon-192.png ikon-512.png ikon-maskable-512.png; do if [ -f "$f" ]; then cp "$f" _site/; fi; done
          mkdir _site/adres && cp adres/*.json _site/adres/
          V=$(cat index.html config.js | sha256sum | cut -c1-7)
          echo "V=$V" >> "$GITHUB_ENV"
          sed -i "s/const BUILD = '__BUILD__'/const BUILD = '$V'/" _site/index.html
          grep -q "const BUILD = '$V'" _site/index.html

      - name: Kutuphaneler (sabit surum, npm butunluk kontrolu)
        run: |
          set -euo pipefail
          mkdir -p _site/lib
          K=$(mktemp -d); H="$PWD"
          # al <paket@surum veya resmi tgz adresi> <paket icindeki dosya> <yayin adi>
          # npm pack, indirilen paketi kayit defterindeki butunluk ozetiyle (sha512) dogrular; surumler sabittir.
          al() {
            ( cd "$K" && rm -rf package ./*.tgz && f=$(npm pack --silent "$1" | tail -n1) && tar xzf "$f" )
            cp "$K/package/$2" "$H/_site/lib/$3"
            echo "$3 <- $1  sha256:$(sha256sum "$H/_site/lib/$3" | cut -c1-16)"
          }
          al pdfmake@0.2.10 build/pdfmake.min.js pdfmake.min.js
          al pdfmake@0.2.10 build/vfs_fonts.js vfs_fonts.js
          al https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz dist/xlsx.full.min.js xlsx.full.min.js
          grep -q '0\.20\.3' _site/lib/xlsx.full.min.js
          ls -la _site/lib

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4

      - name: Acik programlara bildirim
        if: ${{ env.SB_URL != '' && env.SB_KEY != '' }}
        run: |
          H=(-H "apikey: $SB_KEY" -H "Content-Type: application/json")
          [[ "$SB_KEY" == eyJ* ]] && H+=(-H "Authorization: Bearer $SB_KEY")
          ROW=$(curl -sSf "${H[@]}" -H "Prefer: resolution=merge-duplicates,return=representation" \
            "$SB_URL/rest/v1/pt_rows?on_conflict=tbl,id&select=tbl,id,data,deleted,updated_at" \
            -d "[{\"tbl\":\"meta\",\"id\":\"app_version\",\"data\":{\"sha\":\"$V\"},\"deleted\":false}]")
          MSG=$(jq -c '{messages:[{topic:"pronto",event:"rows",private:true,payload:{rows:.}}]}' <<<"$ROW")
          curl -sSf "${H[@]}" "$SB_URL/realtime/v1/api/broadcast" -d "$MSG"
          echo "Bildirim gonderildi: $V"
